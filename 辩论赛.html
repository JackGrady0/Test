<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汇智·思辨·致远 - 精英辩论赛计时系统</title>
    <style>
        :root {
            --red-bg: #DE2910; /* 中国红 */
            --blue-bg: #0055FF; /* 科技蓝 */
            --header-bg: #1a1a1a; /* 顶部深色背景 */
            --gold-text: #FFD700; /* 金色文字 */
            
            --text-color: #ffffff;
            --font-main: 'Microsoft YaHei', 'PingFang SC', 'Segoe UI', sans-serif;
            --font-mono: 'Courier New', Courier, monospace;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: var(--font-main);
            background-color: #000;
            display: flex;
            flex-direction: column; /* 改为垂直布局 */
        }

        /* --- 顶部标题栏设计 --- */
        .page-header {
            height: 14vh; /* 占据视口高度的14% */
            background-color: var(--header-bg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 20;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            /* 底部红蓝渐变分割线 */
            border-bottom: 3px solid;
            border-image: linear-gradient(to right, var(--red-bg) 50%, var(--blue-bg) 50%) 1;
        }

        .main-title {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: 0.3rem;
            background: linear-gradient(45deg, #FFD700, #FDB931, #FFD700); /* 金色渐变字 */
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        .sub-title {
            font-size: 1.4rem;
            color: rgba(255,255,255,0.9);
            font-weight: 400;
            letter-spacing: 0.1rem;
        }

        /* --- 下方主体容器 --- */
        .container {
            flex: 1; /* 自动占据剩余高度 */
            display: flex;
            width: 100%;
            position: relative;
        }

        /* 左右分屏 */
        .side {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center; /* 垂直居中 */
            align-items: center;
            position: relative;
            transition: background-color 0.3s ease;
        }

        .side.red {
            background-color: var(--red-bg);
            /* 中间分割线 */
            border-right: 1px solid rgba(255,255,255,0.15);
        }

        .side.blue {
            background-color: var(--blue-bg);
            border-left: 1px solid rgba(0,0,0,0.1);
        }

        /* 正反方标签 */
        .team-label {
            font-size: 2rem;
            font-weight: 700;
            color: rgba(255,255,255,0.9);
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 2px solid rgba(255,255,255,0.5);
            padding: 5px 20px;
            border-radius: 4px;
            background: rgba(0,0,0,0.1);
        }

        /* 下拉菜单容器 */
        .select-container {
            margin-bottom: 10px;
            z-index: 10;
        }

        select {
            padding: 8px 15px;
            font-size: 1rem;
            background: rgba(0, 0, 0, 0.25);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 4px;
            outline: none;
            cursor: pointer;
            backdrop-filter: blur(4px);
            font-family: var(--font-main);
        }

        select option {
            background: #333;
            color: #fff;
        }

        /* 时间显示 */
        .timer-display {
            font-family: var(--font-mono);
            font-size: 11vw; /* 稍微调小一点适配标题 */
            font-weight: bold;
            color: var(--text-color);
            margin: 0;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 5px 15px rgba(0,0,0,0.3);
            z-index: 5;
            padding: 20px 0;
        }

        /* 控制按钮 */
        .controls {
            display: flex;
            gap: 20px;
            z-index: 10;
            margin-top: 10px;
        }

        button {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.8);
            color: #fff;
            padding: 8px 25px;
            font-size: 1.1rem;
            cursor: pointer;
            border-radius: 50px;
            transition: all 0.2s ease;
            font-weight: 600;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        button:hover {
            background: #fff;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        
        #side-red button:hover { color: var(--red-bg); }
        #side-blue button:hover { color: var(--blue-bg); }

        button:active { transform: scale(0.98); }

        /* 状态指示器 */
        .status {
            margin-top: 15px;
            font-size: 0.9rem;
            color: rgba(255,255,255,0.8);
            height: 20px;
            font-weight: 500;
        }

        /* 闪烁动画 */
        @keyframes flash-alert {
            0% { background-color: inherit; }
            50% { background-color: #330000; }
            100% { background-color: inherit; }
        }

        .flashing {
            animation: flash-alert 0.6s infinite;
        }
        
        /* 负数样式 */
        .negative {
            color: #FFD700; /* 亮黄色 */
            text-shadow: 0 0 15px rgba(0,0,0,0.8);
        }

    </style>
</head>
<body>

    <header class="page-header">
        <div class="main-title">汇智 · 思辨 · 致远</div>
        <div class="sub-title">—— 新吴区人才培养导师工作室精英辩论赛 ——</div>
    </header>

    <div class="container">
        <div class="side red" id="side-red">
            <div class="team-label">正方 (PRO)</div>
            
            <div class="select-container">
                <select id="stage-select-red" onchange="changeStage('red')">
                    <option value="0" disabled selected>-- 请选择环节 --</option>
                </select>
            </div>

            <div class="timer-display" id="timer-red">00:00</div>
            
            <div class="controls">
                <button onclick="toggleTimer('red')" id="btn-red">开始</button>
                <button onclick="resetTimer('red')">重置</button>
            </div>
            <div class="status" id="status-red">就绪</div>
        </div>

        <div class="side blue" id="side-blue">
            <div class="team-label">反方 (CON)</div>
            
            <div class="select-container">
                <select id="stage-select-blue" onchange="changeStage('blue')">
                    <option value="0" disabled selected>-- 请选择环节 --</option>
                </select>
            </div>

            <div class="timer-display" id="timer-blue">00:00</div>

            <div class="controls">
                <button onclick="toggleTimer('blue')" id="btn-blue">开始</button>
                <button onclick="resetTimer('blue')">重置</button>
            </div>
            <div class="status" id="status-blue">就绪</div>
        </div>
    </div>

    <script>
        // 定义比赛环节数据
        const stages = [
            { name: "自我介绍 (3分)", time: 180 },
            { name: "开篇立论 (2.5分)", time: 150 },
            { name: "攻辩交锋 (2分)", time: 120 },
            { name: "攻辩小结 (2分)", time: 120 },
            { name: "自由辩论 (7分)", time: 420 },
            { name: "总结陈词 (2分)", time: 120 },
            { name: "评委点评 (6分)", time: 360 }
        ];

        const state = {
            red: { totalTime: 0, remaining: 0, interval: null, isRunning: false },
            blue: { totalTime: 0, remaining: 0, interval: null, isRunning: false }
        };

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playSound(type) {
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'beep') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'ding') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);
                osc.start();
                osc.stop(audioCtx.currentTime + 1.5);
            }
        }

        function initSelectors() {
            const selectRed = document.getElementById('stage-select-red');
            const selectBlue = document.getElementById('stage-select-blue');

            stages.forEach((stage) => {
                const optionRed = document.createElement('option');
                optionRed.value = stage.time;
                optionRed.text = stage.name;
                selectRed.appendChild(optionRed);

                const optionBlue = document.createElement('option');
                optionBlue.value = stage.time;
                optionBlue.text = stage.name;
                selectBlue.appendChild(optionBlue);
            });
        }

        function formatTime(seconds) {
            const absSeconds = Math.abs(seconds);
            const m = Math.floor(absSeconds / 60);
            const s = absSeconds % 60;
            const sign = seconds < 0 ? "-" : "";
            return `${sign}${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function updateDisplay(side) {
            const display = document.getElementById(`timer-${side}`);
            const seconds = state[side].remaining;
            display.textContent = formatTime(seconds);
            
            if (seconds < 0) {
                display.classList.add('negative');
            } else {
                display.classList.remove('negative');
            }
        }

        function changeStage(side) {
            const select = document.getElementById(`stage-select-${side}`);
            const time = parseInt(select.value);
            
            clearInterval(state[side].interval);
            state[side].isRunning = false;
            document.getElementById(`btn-${side}`).textContent = "开始";
            document.getElementById(`side-${side}`).classList.remove('flashing');
            document.getElementById(`status-${side}`).textContent = "就绪";

            state[side].totalTime = time;
            state[side].remaining = time;
            updateDisplay(side);
        }

        function tick(side) {
            state[side].remaining--;
            const t = state[side].remaining;

            if (t === 3 || t === 2 || t === 1) playSound('beep');
            else if (t === 0) playSound('ding');

            if (t < 0) {
                document.getElementById(`side-${side}`).classList.add('flashing');
                document.getElementById(`status-${side}`).textContent = "超时计时中...";
            } else {
                document.getElementById(`side-${side}`).classList.remove('flashing');
            }

            updateDisplay(side);
        }

        function toggleTimer(side) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const btn = document.getElementById(`btn-${side}`);
            const status = document.getElementById(`status-${side}`);

            if (state[side].isRunning) {
                clearInterval(state[side].interval);
                state[side].isRunning = false;
                btn.textContent = "继续";
                status.textContent = "已暂停";
                document.getElementById(`side-${side}`).classList.remove('flashing');
            } else {
                if(state[side].totalTime === 0 && state[side].remaining === 0) {
                    alert("请先选择比赛环节");
                    return;
                }
                state[side].interval = setInterval(() => tick(side), 1000);
                state[side].isRunning = true;
                btn.textContent = "暂停";
                status.textContent = state[side].remaining < 0 ? "超时计时中..." : "计时中...";
                if (state[side].remaining < 0) {
                    document.getElementById(`side-${side}`).classList.add('flashing');
                }
            }
        }

        function resetTimer(side) {
            clearInterval(state[side].interval);
            state[side].isRunning = false;
            state[side].remaining = state[side].totalTime;
            
            document.getElementById(`btn-${side}`).textContent = "开始";
            document.getElementById(`side-${side}`).classList.remove('flashing');
            document.getElementById(`timer-${side}`).classList.remove('negative');
            document.getElementById(`status-${side}`).textContent = "已重置";
            
            updateDisplay(side);
        }

        window.onload = initSelectors;
    </script>
</body>
</html>
